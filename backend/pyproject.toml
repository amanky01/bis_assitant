[project]
name = "bis-assistant-backend"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "starlette>=1.3.1",
    "uvicorn[standard]",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.10.1,<3",
    "email-validator>=2,<3",
    "langchain>=1.3.9,<2",
    "langchain-core>=1.2.22,<2",
    "langchain-google-genai>=4,<5",
    "langchain-groq>=1,<2",
    "langgraph>=1.0.10,<2",
    "langgraph-checkpoint>=4.1.1",
    "google-genai>=1",
    "pymongo>=4.18.3,<5",
    "pyjwt>=2.10.1,<3",
    "bcrypt>=4,<5",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=6.1",
    "lxml-html-clean>=0.4.5",
    "trafilatura>=1.12",
    "pymupdf>=1.25.1",
    "ddgs>=9",
    "python-dotenv>=1.2.2,<2",
    "rich>=13.8.1",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
